name: Google Place agency identity

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-agency-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Verify Eternal and Westlake Google Place identities
        run: python3 website/check-google-place-identity.py