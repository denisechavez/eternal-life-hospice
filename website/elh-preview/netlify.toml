# Netlify configuration for Eternal Life Hospice
# Site files live at the repo root; no build step (static site).
[build]
  # Two steps run before every deploy:
  #   1. Regenerate city-data.json so /coverage?list=true stays in sync.
  #   2. Regenerate search-index.json so new pages appear in site search.
  # Keep this duplicate from reactivating Netlify Forms. The public production
  # processor is POST /api/form-submit on the Replit deployment.
  command = "python3 ../strip-netlify-form-routing.py . && node netlify/scripts/sync-city-data.js && node assets/build-search-index.js"
  publish = "."

# Pretty URLs (serving /page from page.html) are enabled by default.
# Custom 404 is served automatically from /404.html.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Post-deploy PageSpeed check ─────────────────────────────────────────────
# Runs on every successful production deploy via the onSuccess lifecycle hook.
# Requires GOOGLE_API_KEY set in Netlify Site → Environment variables.
# Optional: PSI_THRESHOLD (int, default 80) and PSI_URL to override the target.
[[plugins]]
  package = "./netlify/plugins/check-pagespeed"
