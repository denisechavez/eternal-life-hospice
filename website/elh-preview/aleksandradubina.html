<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aleksandra Dubina — Digital Business Card</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/favicon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#2A0E28;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 20px;}

.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:20px;}

/* Flip card */
.flip-scene{width:100%;aspect-ratio:332/195;perspective:900px;cursor:pointer;}
.flip-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);}
.flip-inner.flipped{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.55);}
.flip-face img{width:100%;height:100%;object-fit:cover;display:block;}
.flip-face.back{transform:rotateY(180deg);}

.hint{font-size:11px;color:rgba(201,176,126,.65);letter-spacing:.5px;display:flex;align-items:center;gap:5px;}
.hint svg{width:12px;height:12px;opacity:.7;}

/* Save button */
.save-btn{display:block;width:100%;text-align:center;padding:16px;background:#C9B07E;color:#3C1C3B;font-size:15px;font-weight:bold;text-decoration:none;border-radius:10px;letter-spacing:.3px;font-family:Arial,Helvetica,sans-serif;}
.save-btn:active{opacity:.85;}
</style>

  <!-- UserWay (accessibility) and WhatConverts (call-tracking) loaded by analytics.js -->
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<main id="main-content" tabindex="-1">
<div class="wrap">

  <div class="flip-scene" id="flipScene" role="button" aria-label="Flip business card" tabindex="0">
    <div class="flip-inner" id="flipInner">
      <div class="flip-face front">
        <img src="/assets/img/biz-card-front.webp" alt="Aleksandra Dubina business card front">
      </div>
      <div class="flip-face back">
        <img src="/assets/img/biz-card-back.webp" alt="Aleksandra Dubina business card back">
      </div>
    </div>
  </div>

  <div class="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    Tap card to flip
  </div>

  <a class="save-btn" href="/assets/aleksandra-dubina.vcf" download="Aleksandra-Dubina-ELH.vcf">+ Save Contact to Phone</a>

</div>
</main>

<script>
const scene = document.getElementById('flipScene');
const inner = document.getElementById('flipInner');
scene.addEventListener('click', () => inner.classList.toggle('flipped'));
scene.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') inner.classList.toggle('flipped'); });
</script>
</body>
</html>
