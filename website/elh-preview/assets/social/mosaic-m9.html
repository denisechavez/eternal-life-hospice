<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<title>Month 9 — Stillness Arrives</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0d0408; }

  .card {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    border: 1.5px solid #C9B07E;
  }

  .header {
    background: #F5F0EB;
    padding: 3vh 5vw 2.2vh;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .series-label {
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 1.6vw;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #5B2E59;
  }

  .month-tag {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 1.9vw;
    color: #C9B07E;
  }

  /* 5-image layout: 2×2 grid + one wide bottom strip */
  .image-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 0.85fr;
    position: relative;
    overflow: hidden;
  }

  .cell {
    overflow: hidden;
    position: relative;
  }

  .cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(1.02) saturate(0.9);
  }

  /* Stillness cell spans full bottom row */
  .cell-stillness {
    grid-column: 1 / -1;
    overflow: hidden;
    position: relative;
  }

  .cell-stillness img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
    filter: brightness(0.88) contrast(1.12) saturate(0.8);
  }

  .cell:nth-child(1) img { object-position: center center; }
  .cell:nth-child(2) img { object-position: center 30%; filter: brightness(0.98) saturate(0.85); }
  .cell:nth-child(3) img { object-position: center 45%; filter: brightness(1.03) saturate(0.88); }
  .cell:nth-child(4) img { object-position: center center; filter: brightness(1.05) saturate(1.0) contrast(1.04); }

  /* Gold stitch lines */
  .stitch { position: absolute; background: #C9B07E; z-index: 3; pointer-events: none; }
  .stitch-h1  { top: 33.33%; left: 0; right: 0; height: 2px; }
  .stitch-h2  { top: 66.66%; left: 0; right: 0; height: 2px; }
  .stitch-v   { top: 0; left: 50%; bottom: 33.34%; width: 2px; }
  .stitch-top    { top: 0; left: 0; right: 0; height: 1.5px; }
  .stitch-bottom { bottom: 0; left: 0; right: 0; height: 1.5px; }

  /* Center diamond */
  .stitch-center {
    position: absolute;
    top: 33.33%; left: 50%;
    transform: translate(-50%, -50%);
    width: 10px; height: 10px;
    background: #C9B07E;
    rotate: 45deg;
    z-index: 4;
  }

  /* Cell labels */
  .cell-label {
    position: absolute;
    bottom: 1.4vh;
    left: 1.5vw;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 1vw;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(245,240,235,0.78);
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    z-index: 3;
  }

  /* Stillness label — centered, larger, italic */
  .stillness-label {
    position: absolute;
    bottom: 0; left: 0; right: 0; top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 3.8vw;
    color: rgba(245,240,235,0.72);
    text-shadow: 0 2px 16px rgba(0,0,0,0.7);
    z-index: 3;
    letter-spacing: 0.04em;
    pointer-events: none;
  }

  /* Very subtle global plum tint on top 2 rows */
  .tint {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 66.66%;
    background: #3A1438;
    mix-blend-mode: multiply;
    opacity: 0.08;
    pointer-events: none;
    z-index: 2;
  }

  .footer {
    background: #2A0F28;
    padding: 2.5vh 5vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 1.9vw;
    color: #F5F0EB;
    letter-spacing: 0.06em;
  }

  .caption {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 1.4vw;
    color: #C9B07E;
    letter-spacing: 0.04em;
  }
</style>
  <script>
    (function(d){
      var s = d.createElement("script");
      s.setAttribute("data-widget_layout", "full");
      s.setAttribute("data-position", "2");
      s.setAttribute("data-size", "small");
      s.setAttribute("data-color", "#7c5cbf");
      s.setAttribute("data-account", "puHleOAe1C");
      s.setAttribute("src", "https://cdn.userway.org/widget.js");
      (d.body || d.head).appendChild(s);
    })(document)
  </script>
  <noscript>Please ensure Javascript is enabled for purposes of <a href="https://userway.org">website accessibility</a></noscript>

  <style>#userwayAccessibilityIcon{transform:scale(0.72)!important;transform-origin:bottom left!important}</style>
</head>
<body>
<div class="card">
  <div class="header">
    <span class="series-label">Eternal Care Brief</span>
    <span class="month-tag">Month Nine</span>
  </div>

  <div class="image-grid">
    <div class="stitch stitch-top"></div>
    <div class="stitch stitch-bottom"></div>
    <div class="stitch stitch-h1"></div>
    <div class="stitch stitch-h2"></div>
    <div class="stitch stitch-v"></div>
    <div class="stitch-center"></div>
    <div class="tint"></div>

    <div class="cell">
      <img src="elh-amethyst.png" alt="Amethyst">
      <span class="cell-label">The Stone</span>
    </div>
    <div class="cell">
      <img src="elh-bowl.png" alt="Singing bowl">
      <span class="cell-label">The Energy</span>
    </div>
    <div class="cell">
      <img src="elh-pen.png" alt="Writing pen">
      <span class="cell-label">The Word</span>
    </div>
    <div class="cell">
      <img src="elh-eye.png" alt="Eye">
      <span class="cell-label">The Touch</span>
    </div>

    <div class="cell-stillness">
      <img src="elh-stillness.png" alt="Candle">
      <div class="stillness-label">Stillness.</div>
    </div>
  </div>

  <div class="footer">
    <span class="brand">Eternal Life Hospice</span>
    <span class="caption">Care That Honors Life</span>
  </div>
</div>
</body>
</html>
