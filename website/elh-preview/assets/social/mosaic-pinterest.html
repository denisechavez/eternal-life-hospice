<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<title>Pinterest — Tall Mosaic Pin</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #2A0F28;
  }

  .pin {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    border: 1.5px solid #C9B07E;
    overflow: hidden;
  }

  /* Top header */
  .pin-header {
    background: #2A0F28;
    padding: 3.5vh 5vw 2.8vh;
    display: flex;
    flex-direction: column;
    gap: 0.8vh;
    flex-shrink: 0;
  }

  .series {
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 1.4vw;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #C9B07E;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 4vw;
    line-height: 1.2;
    color: #F5F0EB;
  }

  .gold-rule {
    width: 5vw;
    height: 1.5px;
    background: #C9B07E;
    margin-top: 0.6vh;
  }

  /* Four image rows — each takes equal flex */
  .images {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .img-row {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  .img-row img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(1.02) saturate(0.9);
  }

  .img-row:nth-child(1) img { object-position: center 40%; }
  .img-row:nth-child(2) img { object-position: center 30%; filter: brightness(0.98) saturate(0.85); }
  .img-row:nth-child(3) img { object-position: center 45%; filter: brightness(1.03) saturate(0.88); }
  .img-row:nth-child(4) img { object-position: center center; filter: brightness(1.05) saturate(1.0); }

  /* Gold stitch seam between each row */
  .stitch-row {
    height: 2px;
    background: #C9B07E;
    flex-shrink: 0;
    z-index: 2;
  }

  /* Pillar label overlaid on each row */
  .row-label {
    position: absolute;
    bottom: 1.2vh;
    right: 4vw;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 1.2vw;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(245,240,235,0.78);
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }

  /* Gold dot accent left edge of each label */
  .row-label::before {
    content: '●';
    color: #C9B07E;
    margin-right: 0.6vw;
    font-size: 0.7vw;
  }

  /* Subtle plum overlay across all images */
  .images::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #2A0F28;
    mix-blend-mode: multiply;
    opacity: 0.1;
    pointer-events: none;
    z-index: 1;
  }

  /* Bottom footer */
  .pin-footer {
    background: #2A0F28;
    padding: 3vh 5vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 1.9vw;
    color: #F5F0EB;
    letter-spacing: 0.06em;
  }

  .site {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 1.4vw;
    color: rgba(201,176,126,0.7);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="pin">
  <div class="pin-header">
    <span class="series">Eternal Care Brief</span>
    <h1 class="headline">Four ways<br>to be present.</h1>
    <div class="gold-rule"></div>
  </div>

  <div class="images">
    <div class="img-row">
      <img src="elh-amethyst.png" alt="Amethyst crystal">
      <span class="row-label">The Stone</span>
    </div>
    <div class="stitch-row"></div>

    <div class="img-row">
      <img src="elh-bowl.png" alt="Singing bowl">
      <span class="row-label">Sound</span>
    </div>
    <div class="stitch-row"></div>

    <div class="img-row">
      <img src="elh-pen.png" alt="Writing pen">
      <span class="row-label">The Word</span>
    </div>
    <div class="stitch-row"></div>

    <div class="img-row">
      <img src="elh-eye.png" alt="Eye close-up">
      <span class="row-label">Presence</span>
    </div>
  </div>

  <div class="pin-footer">
    <span class="brand">Eternal Life Hospice</span>
    <span class="site">eternallifehospice.com</span>
  </div>
</div>
</body>
</html>
