<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<title>Month 3 — First Stitch</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #F5F0EB; }

  .card {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    border: 1.5px solid #C9B07E;
  }

  .header {
    background: #F5F0EB;
    padding: 3.5vh 5vw 2.5vh;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .series-label {
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 1.7vw;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #5B2E59;
  }

  .month-tag {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 2vw;
    color: #C9B07E;
  }

  /* Two images stitched side by side */
  .image-row {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  .stitch-border-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1.5px;
    background: #C9B07E;
    z-index: 3;
  }

  .stitch-border-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1.5px;
    background: #C9B07E;
    z-index: 3;
  }

  /* Vertical gold stitch between the two images */
  .stitch-vertical {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 100%;
    background: #C9B07E;
    z-index: 3;
  }

  .image-cell {
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
  }

  .image-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: brightness(1.02) saturate(0.9);
  }

  /* Subtle plum tint on both cells */
  .image-cell::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #2A0F28;
    mix-blend-mode: multiply;
    opacity: 0.12;
    pointer-events: none;
  }

  /* Left cell: amethyst — slightly warmer treatment */
  .cell-left img {
    filter: brightness(1.04) saturate(0.95) contrast(1.05);
  }

  /* Right cell: bowl — slightly cooler/softer */
  .cell-right img {
    filter: brightness(0.98) saturate(0.85);
    object-position: center 30%;
  }

  .footer {
    background: #2A0F28;
    padding: 2.8vh 5vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 2vw;
    color: #F5F0EB;
    letter-spacing: 0.06em;
  }

  .caption {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 1.5vw;
    color: #C9B07E;
    letter-spacing: 0.04em;
  }

  /* Small stitch count indicator */
  .stitch-count {
    position: absolute;
    bottom: 2.5vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.6vw;
    z-index: 4;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #C9B07E;
  }

  .dot.empty {
    background: transparent;
    border: 1px solid rgba(201,176,126,0.4);
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <span class="series-label">Eternal Care Brief</span>
    <span class="month-tag">Month Three</span>
  </div>

  <div class="image-row">
    <div class="stitch-border-top"></div>
    <div class="stitch-border-bottom"></div>
    <div class="stitch-vertical"></div>

    <div class="image-cell cell-left">
      <img src="elh-amethyst.png" alt="Amethyst crystal">
    </div>
    <div class="image-cell cell-right">
      <img src="elh-bowl.png" alt="Singing bowl">
    </div>
  </div>

  <div class="footer">
    <span class="brand">Eternal Life Hospice</span>
    <span class="caption">Care That Honors Life</span>
  </div>
</div>
</body>
</html>
