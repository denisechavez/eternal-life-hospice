<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<title>Month 5 — Building</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #F5F0EB; }

  .card {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    border: 1.5px solid #C9B07E;
  }

  .header {
    background: #F5F0EB;
    padding: 3.5vh 5vw 2.5vh;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .series-label {
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 1.7vw;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #5B2E59;
  }

  .month-tag {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 2vw;
    color: #C9B07E;
  }

  /* Asymmetric 3-image layout: left half tall + right half stacked 2 */
  .image-grid {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Gold stitch borders */
  .stitch { position: absolute; background: #C9B07E; z-index: 3; }
  .stitch-top    { top: 0; left: 0; right: 0; height: 1.5px; }
  .stitch-bottom { bottom: 0; left: 0; right: 0; height: 1.5px; }
  .stitch-v      { top: 0; left: 55%; width: 2px; height: 100%; }
  .stitch-h      { top: 50%; left: 55%; right: 0; height: 2px; }

  /* Left: tall single image */
  .cell-main {
    width: 55%;
    height: 100%;
    overflow: hidden;
    flex-shrink: 0;
  }

  .cell-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: brightness(1.04) saturate(0.9) contrast(1.05);
  }

  /* Right: two stacked */
  .cell-stack {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .cell-sm {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .cell-sm img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(1.02) saturate(0.88);
  }

  .cell-sm:first-child img {
    object-position: center 30%;
  }

  .cell-sm:last-child img {
    object-position: center 40%;
  }

  /* Subtle plum tint across all */
  .image-grid::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #2A0F28;
    mix-blend-mode: multiply;
    opacity: 0.09;
    pointer-events: none;
    z-index: 2;
  }

  .footer {
    background: #2A0F28;
    padding: 2.8vh 5vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 2vw;
    color: #F5F0EB;
    letter-spacing: 0.06em;
  }

  .caption {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 1.5vw;
    color: #C9B07E;
    letter-spacing: 0.04em;
  }
</style>
  <script>
    (function(d){
      d.addEventListener('DOMContentLoaded', function(){
        var s = d.createElement('script');
        s.setAttribute('data-color','#6793AC');
        s.setAttribute('data-trigger','elh-ada-trigger');
        s.setAttribute('data-account','puHleOAe1C');
        s.src = 'https://cdn.userway.org/widget.js';
        d.body.appendChild(s);
      });
    })(document)
  </script>
  <noscript>Please ensure Javascript is enabled for purposes of <a href="https://userway.org">website accessibility</a></noscript>

  <style>#userwayAccessibilityIcon{transform:scale(0.72)!important;transform-origin:bottom left!important}</style>
</head>
<body>
<div class="card">
  <div class="header">
    <span class="series-label">Eternal Care Brief</span>
    <span class="month-tag">Month Five</span>
  </div>

  <div class="image-grid">
    <div class="stitch stitch-top"></div>
    <div class="stitch stitch-bottom"></div>
    <div class="stitch stitch-v"></div>
    <div class="stitch stitch-h"></div>

    <div class="cell-main">
      <img src="elh-amethyst.png" alt="Amethyst crystal">
    </div>

    <div class="cell-stack">
      <div class="cell-sm">
        <img src="elh-bowl.png" alt="Singing bowl">
      </div>
      <div class="cell-sm">
        <img src="elh-pen.png" alt="Writing pen">
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="brand">Eternal Life Hospice</span>
    <span class="caption">Care That Honors Life</span>
  </div>
</div>
</body>
</html>
