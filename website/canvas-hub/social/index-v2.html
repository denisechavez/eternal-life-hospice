<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELH Social Planner — Public Channels</title>
<style>
  :root{
    --deep:#3C1C3B;--plum:#5B2E59;--gold:#C9B07E;--cream:#F5F0EB;
    --muted:#9B8A99;--border:rgba(92,46,89,.12);
    --gbp:#4285F4;--fb:#1877F2;--li:#0A66C2;
    --tw:#000000;--tt:#2B2B2B;--yt:#FF0000;--em:#5B2E59;
    --card:#fff;--bg:#F0EBE5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--deep);height:100vh;overflow:hidden;display:flex;flex-direction:column}

  /* ── Top bar ── */
  .topbar{background:var(--deep);color:var(--cream);height:46px;display:flex;align-items:center;padding:0 14px;gap:0;flex-shrink:0}
  .tb-brand{display:flex;align-items:center;gap:7px;margin-right:auto}
  .tb-leaf{width:26px;height:26px;border-radius:50%;background:rgba(201,176,126,.2);border:1px solid rgba(201,176,126,.4);display:flex;align-items:center;justify-content:center;font-size:12px}
  .tb-name{font-size:.8rem;font-weight:600;letter-spacing:.02em}
  .tb-dot{width:3px;height:3px;border-radius:50%;background:rgba(245,240,235,.25);margin:0 8px}
  .tb-sub{font-size:.7rem;opacity:.45}
  .tb-week{display:flex;align-items:center;gap:6px}
  .tb-nav{background:none;border:none;color:rgba(245,240,235,.5);cursor:pointer;font-size:.9rem;padding:4px 7px;border-radius:4px;transition:color .15s}
  .tb-nav:hover{color:var(--cream)}
  .tb-wlabel{font-size:.73rem;font-weight:600;letter-spacing:.04em;color:rgba(245,240,235,.8);min-width:160px;text-align:center}
  .tb-theme{font-size:.62rem;opacity:.5;margin-left:6px;font-style:italic}
  .tb-badge{background:rgba(201,176,126,.18);border:1px solid rgba(201,176,126,.3);color:var(--gold);font-size:.6rem;font-weight:700;padding:.18rem .5rem;border-radius:99px;letter-spacing:.07em;margin-left:10px;white-space:nowrap}
  .tb-brief-badge{background:rgba(201,176,126,.35);border:1px solid var(--gold);color:var(--gold);font-size:.6rem;font-weight:700;padding:.18rem .5rem;border-radius:99px;letter-spacing:.07em;margin-left:6px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

  /* ── Progress strip ── */
  .progress-strip{background:var(--plum);height:30px;display:flex;align-items:center;padding:0 14px;gap:0;flex-shrink:0}
  .ps-stat{display:flex;align-items:center;gap:5px;padding:0 12px;border-right:1px solid rgba(255,255,255,.1);font-size:.67rem;color:rgba(245,240,235,.7);white-space:nowrap}
  .ps-stat:first-child{padding-left:0}
  .ps-stat:last-child{border:none;margin-left:auto;padding-right:0}
  .ps-num{font-weight:700;color:var(--gold);font-size:.77rem}
  .ps-bar{flex:1;margin:0 20px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
  .ps-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s}

  /* ── Shell ── */
  .shell{display:grid;grid-template-columns:172px 1fr;flex:1;overflow:hidden}

  /* ── Sidebar ── */
  .sidebar{background:var(--deep);display:flex;flex-direction:column;padding:10px 8px;overflow:hidden}
  .sb-section{font-size:.58rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(245,240,235,.3);padding:0 6px;margin-bottom:5px;margin-top:4px}
  .pfilt{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;cursor:pointer;color:rgba(245,240,235,.75);font-size:.75rem;transition:background .14s;border:none;background:none;width:100%;text-align:left}
  .pfilt:hover{background:rgba(255,255,255,.07)}
  .pfilt.on{background:rgba(255,255,255,.11);color:var(--cream)}
  .pfilt .ico{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ico-all{background:rgba(201,176,126,.25)}
  .ico-gbp{background:#4285F4}
  .ico-fb{background:#1877F2}
  .ico-li{background:#0A66C2}
  .ico-tw{background:#000}
  .ico-tt{background:linear-gradient(135deg,#010101 50%,#69C9D0)}
  .ico-yt{background:#FF0000}
  .ico-em{background:var(--plum);border:1px solid rgba(201,176,126,.4)}
  .pfilt .cnt{margin-left:auto;font-size:.6rem;font-weight:700;color:rgba(245,240,235,.4);background:rgba(255,255,255,.1);border-radius:99px;padding:.08rem .38rem}
  .pfilt.on .cnt{color:var(--gold)}
  .sb-div{border:none;border-top:1px solid rgba(255,255,255,.07);margin:7px 0}
  .ai-btn{width:100%;background:var(--gold);color:var(--deep);border:none;border-radius:7px;padding:7px 8px;font-size:.73rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:opacity .14s}
  .ai-btn:hover{opacity:.88}
  .sb-spacer{flex:1}
  .sb-status{background:rgba(0,0,0,.25);border-radius:7px;padding:8px;margin-top:8px}
  .sb-status-row{display:flex;justify-content:space-between;align-items:center;font-size:.67rem;color:rgba(245,240,235,.5);padding:2px 0}
  .sb-status-row span:last-child{font-weight:600;color:rgba(245,240,235,.8)}
  .sb-status-row.hi span:last-child{color:var(--gold)}
  .week-counter{font-size:.6rem;color:rgba(245,240,235,.35);text-align:center;margin-top:6px}

  /* ── Main ── */
  .main{overflow-y:auto;display:flex;flex-direction:column;padding:8px 12px;gap:5px}
  .day-header{display:grid;grid-template-columns:44px repeat(5,1fr);gap:5px;flex-shrink:0;position:sticky;top:0;background:var(--bg);z-index:10;padding-bottom:3px}
  .dh{text-align:center;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:2px 0}

  /* ── Calendar rows ── */
  .cal-row{display:grid;grid-template-columns:44px repeat(5,1fr);gap:5px;min-height:90px}
  .row-icon{display:flex;align-items:center;justify-content:center;padding-top:4px}
  .ri{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ri-gbp{background:#4285F4}
  .ri-fb{background:#1877F2}
  .ri-li{background:#0A66C2}
  .ri-tw{background:#000}
  .ri-tt{background:linear-gradient(135deg,#010101 50%,#69C9D0)}
  .ri-yt{background:#FF0000}
  .ri-em{background:var(--plum);border:1px solid rgba(201,176,126,.5)}

  /* ── Post cell ── */
  .cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 9px;cursor:pointer;transition:box-shadow .16s,transform .16s;position:relative;display:flex;flex-direction:column;overflow:hidden}
  .cell::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:8px 0 0 8px}
  .cell[data-platform="gbp"]::before{background:var(--gbp)}
  .cell[data-platform="fb"]::before{background:var(--fb)}
  .cell[data-platform="li"]::before{background:var(--li)}
  .cell[data-platform="tw"]::before{background:var(--tw)}
  .cell[data-platform="tt"]::before{background:#69C9D0}
  .cell[data-platform="yt"]::before{background:var(--yt)}
  .cell[data-platform="em"]::before{background:var(--gold)}
  .cell:hover{box-shadow:0 3px 14px rgba(60,28,59,.12);transform:translateY(-1px)}
  .c-title{font-size:.7rem;font-weight:700;color:var(--deep);line-height:1.3;margin-bottom:3px;padding-left:4px}
  .c-preview{font-size:.63rem;color:var(--muted);line-height:1.4;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;padding-left:4px}
  .c-foot{display:flex;align-items:center;justify-content:space-between;margin-top:5px;padding-left:4px}
  .st{font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.13rem .38rem;border-radius:99px}
  .st-sched{background:#EBF3FF;color:#1155CC}
  .st-draft{background:#FFF7E6;color:#92600A}
  .st-pub{background:#E6F4EA;color:#1A6E35}
  .st-brief{background:rgba(201,176,126,.25);color:#7A5C00;border:1px solid rgba(201,176,126,.5)}
  .c-time{font-size:.58rem;color:var(--muted)}

  /* ── Empty cell ── */
  .empty{background:rgba(255,255,255,.3);border:1px dashed rgba(92,46,89,.08);cursor:default;align-items:center;justify-content:center}
  .empty:hover{box-shadow:none;transform:none}
  .empty::before{display:none}
  .empty-plus{font-size:1rem;color:rgba(92,46,89,.13);line-height:1}

  /* ── Brief banner ── */
  .brief-banner{background:linear-gradient(135deg,rgba(201,176,126,.15),rgba(201,176,126,.08));border:1px solid rgba(201,176,126,.4);border-radius:8px;padding:6px 12px;display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-shrink:0}
  .brief-banner-icon{font-size:1rem}
  .brief-banner-text{font-size:.7rem;color:var(--deep);font-weight:600}
  .brief-banner-sub{font-size:.62rem;color:var(--muted);margin-top:1px}

  /* ── Modal ── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(20,5,20,.6);z-index:100;align-items:center;justify-content:center}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(20,5,20,.35)}
  .mhead{background:var(--deep);color:var(--cream);padding:12px 16px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .mhead-left{flex:1}
  .mhead h2{font-size:.85rem;font-weight:700;line-height:1.3}
  .mpills{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .mpill{font-size:.58rem;font-weight:600;padding:.15rem .45rem;border-radius:99px;background:rgba(255,255,255,.12);letter-spacing:.04em}
  .mpill-brief{background:rgba(201,176,126,.3);color:var(--gold)}
  .mclose{background:none;border:none;color:rgba(245,240,235,.6);font-size:1rem;cursor:pointer;flex-shrink:0}
  .mbody{padding:14px 16px;display:flex;flex-direction:column;gap:11px}
  .field-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
  .copy-area{width:100%;min-height:120px;border:1.5px solid var(--border);border-radius:7px;padding:9px 11px;font-size:.77rem;line-height:1.65;color:var(--deep);resize:vertical;font-family:inherit;background:var(--cream)}
  .copy-area:focus{outline:none;border-color:var(--plum)}
  .tags-wrap{display:flex;gap:4px;flex-wrap:wrap}
  .ht{font-size:.63rem;background:rgba(91,46,89,.07);color:var(--plum);padding:.15rem .4rem;border-radius:4px}
  .img-note{background:rgba(92,46,89,.04);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:.67rem;color:var(--muted);display:flex;align-items:center;gap:5px}
  .mfooter{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--border)}
  .btn{padding:6px 12px;border-radius:6px;font-size:.73rem;font-weight:700;cursor:pointer;border:none;transition:opacity .14s}
  .btn:hover{opacity:.87}
  .bp{background:var(--plum);color:#fff}
  .bg{background:var(--gold);color:var(--deep)}
  .bo{background:none;border:1.5px solid var(--border);color:var(--muted)}

  /* ── Toast ── */
  .toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--deep);color:var(--cream);padding:6px 14px;border-radius:99px;font-size:.73rem;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}

  /* ── Scrollbar ── */
  .main::-webkit-scrollbar{width:4px}
  .main::-webkit-scrollbar-track{background:transparent}
  .main::-webkit-scrollbar-thumb{background:rgba(92,46,89,.2);border-radius:2px}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="tb-brand">

<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-section">Platforms</div>

    <button class="pfilt on" onclick="filt('all',this)">
      <span class="ico ico-all">

    <button class="pfilt" onclick="filt('fb',this)">

    <button class="pfilt" onclick="filt('li',this)">
      <span class="ico ico-li">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="white"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2" fill="white"/></svg>

    <button class="pfilt" onclick="filt('tw',this)">

    <button class="pfilt" onclick="filt('tt',this)">

    <button class="pfilt" onclick="filt('yt',this)">
      <span class="ico ico-yt">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="white"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.95C5.12 20 12 20 12 20s6.88 0 8.59-.47a2.78 2.78 0 0 0 1.95-1.95A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="#FF0000"/></svg>

    <div class="sb-div"></div>
    <button class="ai-btn">✦ Generate with AI</button>

    <div class="sb-status">
      <div class="sb-status-row hi"><span>Scheduled</span><span id="sb-sched">0</span></div>
      <div class="sb-status-row"><span>Draft</span><span id="sb-draft">0</span></div>
      <div class="sb-status-row"><span>Published</span><span id="sb-pub">0</span></div>
    </div>
    <div class="week-counter" id="week-counter">Week 1 of 13 · Aug–Nov 2026</div>
  </aside>

  <!-- Calendar -->
  <main class="main" id="cal-main">
    <!-- Rendered by JS -->
  </main>
</div>

<!-- Post modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
  <div class="mhead" id="mhead">
    <div class="mhead-left">
      <h2 id="mtitle"></h2>
      <div class="mpills" id="mpills"></div>

const POSTS = {

  copy:`Care That Honors Life — and that starts with the truth.\n\nMost families wait too long to call hospice. Not because they don't want help — because of myths that just won't die.\n\n1. "Hospice means giving up." → It's a continuation of care.\n2. "It's only for the last few days." → Eligible patients often have months.\n3. "All treatment stops." → Goals shift to comfort — not abandonment.\n4. "It's only for cancer." → Heart, COPD, dementia, ALS, and more qualify.\n5. "It costs too much." → Medicare covers 100%.\n\nFull guide → eternallifehospice.com/blog/five-hospice-myths\n\n805.953.7273 | eternallifehospice.com\n\n#HospiceCare #HospiceMyths #Medicare #CareThatHonorsLife #VenturaCounty #LosAngelesCounty`},

'0-li-mon':{title:'Why I Started Eternal Life Hospice',plat:'LinkedIn',day:'Mon Aug 10',time:'8:00 AM',status:'Scheduled',
  img:'Aleksandra headshot — warm window light, no clinical setting',
  tags:['#HospiceCare','#HealthcareLeadership','#EndOfLifeCare','#CareThatHonorsLife','#HospiceFounder'],
  copy:`I started Eternal Life Hospice because I kept seeing the same thing.\n\nFamilies getting the call — the prognosis, the timeline — and then being left to figure out the rest on their own.\n\nWhat comes next deserves the same level of care as everything that came before.\n\nWhat I didn't expect was how sacred it would feel. Not sad — sacred. To be trusted with a family at the most tender moment of their lives.\n\nIf you work in healthcare and you've ever given a family that news and wondered what happens next — I'd love to connect.\n\n— Aleksandra Dubina\nFounder & CEO, Eternal Life Hospice\nCertified Hospice Administrator\n\n#HospiceCare #EndOfLifeCare #HealthcareLeadership #CareThatHonorsLife`},

'0-em-tue':{title:'Care Ally Email: Welcome + What Happens After You Refer',plat:'Email — Care Ally',day:'Tue Aug 11',time:'9:00 AM',status:'Scheduled',

  copy:`SUBJECT: What happens after you refer to Eternal Life Hospice\n\nDear [First Name],\n\nWhen you refer a patient to us, here's exactly what happens next.\n\nWithin 2 hours: Our admissions nurse reaches out to the family to begin the intake process.\nWithin 4 hours: Care plan is drafted, medications coordinated, durable medical equipment ordered.\nWithin 24 hours: First registered nurse visit — care is in place, family is educated.\nWithin 48 hours: Full interdisciplinary team engaged — social worker, chaplain, aide.\n\nOur goal: take the next call off your plate completely.\n\nWe accept same-day referrals when clinically appropriate. One call — 805.953.7273 — or refer online at eternallifehospice.com/refer.\n\nWith gratitude,\nAleksandra Dubina\nFounder & CEO, Eternal Life Hospice`},

'0-tw-tue':{title:'Thread: The 5 Hospice Myths',plat:'Twitter / X',day:'Tue Aug 11',time:'10:00 AM',status:'Scheduled',
  img:'Text-based thread. Optional: plum/gold quote card for tweet 1.',
  tags:['#HospiceCare','#HospiceMyths','#Medicare','#EndOfLifeCare'],
  copy:`1/ Most families wait too long to call hospice — not because they don't want help, but because of myths that just won't die. A thread. 🧵\n\n2/ Myth 1: "Hospice means giving up." It's a continuation of care. The goal shifts to comfort and dignity — not abandonment.\n\n3/ Myth 2: "It's only for the last few days." The Medicare hospice benefit covers patients with a 6-month prognosis. Earlier is better.\n\n4/ Myth 3: "All treatment stops." Treatment continues — it shifts to comfort-focused goals. Pain management, symptom control, quality of life.\n\n5/ Myth 4: "Only for cancer patients." Heart failure, COPD, dementia, ALS, renal disease — any terminal diagnosis qualifies.\n\n6/ Myth 5: "It's too expensive." Medicare covers hospice 100%. No deductible, no copay. Most families pay $0.\n\n7/ The full family guide is at eternallifehospice.com/blog/five-hospice-myths — share it with anyone navigating this conversation.`},

'0-gbp-fri':{title:'ACHC Accreditation — Why It Matters',plat:'Google Business',day:'Fri Aug 14',time:'9:00 AM',status:'Scheduled',
  img:'Team photo or credential plaque — professional, warm',
  tags:['#ACHC','#HospiceCare','#EternalLifeHospice','#QualityCare','#VenturaCounty'],
  copy:`Eternal Life Hospice holds three credentials.\n\nMedicare certification is required by law.\nCDPH licensure is required by California.\nACHC accreditation is different. It is voluntary.\n\nThe Accreditation Commission for Health Care conducts an independent, on-site review of our clinical standards, policies, staff competencies, and patient outcomes. They do not take our word for anything. They verify.\n\nWe pursued ACHC accreditation because families deserve an independent guarantee.\n\n805.953.7273 · eternallifehospice.com`},

'0-li-fri':{title:'Choosing Hospice Is Not Giving Up',plat:'LinkedIn',day:'Fri Aug 14',time:'8:00 AM',status:'Scheduled',
  img:'Aleksandra headshot or branded quote card — gold text on plum',
  tags:['#HospiceCare','#EndOfLifeCare','#PalliativeCare','#CareThatHonorsLife','#EternalLifeHospice'],
  copy:`I want to say something clearly, because I hear the opposite every week.\n\nChoosing hospice is not giving up.\n\nIt is a real, deliberate, loving choice — to spend the time that remains the way the person wants to spend it. At home. With family nearby. With pain managed and dignity protected.\n\nThe families who call us early tell us the same thing, every time: they wish they'd called sooner. Not because hospice hurried anything. Because hospice made the time they had better.\n\nFor physicians and discharge planners: early referral is an act of advocacy. Not an ending.\n\n— Aleksandra Dubina\nFounder & CEO, Eternal Life Hospice\n\n#HospiceCare #EndOfLifeCare #CareThatHonorsLife`},

'1-fb-mon':{title:'The First 48 Hours — A Timeline',plat:'Facebook',day:'Mon Aug 17',time:'11:00 AM',status:'Scheduled',

'1-em-tue':{title:'Care Ally Email: Medicare 100% — How to Explain It to Families',plat:'Email — Care Ally',day:'Tue Aug 18',time:'9:00 AM',status:'Scheduled',
  img:'Email header: ELH plum/gold. Simple layout. Aleksandra signature.',
  tags:['Discharge planners','Hospital social workers','Case managers','Referral partners'],
  copy:`SUBJECT: How to explain the Medicare hospice benefit to families (a quick guide)\n\nDear [First Name],\n\nOne of the most common blockers to timely referral is the family's assumption that hospice is expensive. Here's a simple script you can adapt:\n\n"The Medicare hospice benefit covers everything related to the terminal diagnosis — nursing visits, aide support, social work, chaplaincy, medications, and medical equipment. There is no deductible, no copay, and no bill sent to the family. For most families, the cost is $0."\n\nKey facts for families:\n• Medicare Part A covers the hospice benefit\n• Eligibility: physician prognosis of 6 months or less if the illness runs its natural course\n• Coverage includes: medications, DME, RN visits, aide, social work, chaplain, bereavement\n• Family members are not billed\n\nWe verify eligibility for every admission and handle all Medicare coordination.\n\nDownload the full family guide: eternallifehospice.com/family-guide\n\nAlways here,\nAleksandra Dubina`},

  tags:['#HospiceCare','#DischargePlanning','#CaseManagement','#HealthcareProfessionals','#EndOfLifeCare'],
  copy:`For discharge planners and case managers: here's what happens within 24 hours of a referral to Eternal Life Hospice.\n\nHour 0–2: Admissions nurse contacts the family. Insurance verified, eligibility confirmed.\nHour 2–4: Comprehensive symptom assessment. Goals-of-care documentation. Advance directive review.\nHour 4–6: Personalized care plan drafted. DME ordered and delivery scheduled. Pharmacy coordination for comfort medications.\nHour 6–24: First RN visit completed. Family caregiver education: what medications do, what to expect, who to call.\n\nA smooth admission reduces readmission risk and builds family confidence.\n\nWe accept same-day referrals. One call: 805.953.7273\nRefer online: eternallifehospice.com/refer\n\n#HospiceCare #DischargePlanning #CaseManagement`},

'1-tw-fri':{title:'Thread: Fast Facts on Hospice Eligibility',plat:'Twitter / X',day:'Fri Aug 21',time:'10:00 AM',status:'Scheduled',
  img:'Text thread. Optional: eligibility checklist card image.',
  tags:['#HospiceCare','#Medicare','#EndOfLifeCare','#HealthcareProfessionals'],
  copy:`1/ A lot of families don't know if their loved one qualifies for hospice. Quick eligibility guide. 🧵\n\n2/ The core requirement: a physician certifies that if the illness runs its natural course, the patient has a prognosis of 6 months or less.\n\n3/ Qualifying diagnoses include: cancer, heart failure, COPD, end-stage renal disease, dementia, ALS, Parkinson's, stroke, liver failure — and more.\n\n4/ Medicare Part A covers the full benefit. No deductible. No copay. Medications, equipment, nursing, aide, social work, chaplain — all covered.\n\n5/ You can elect hospice and re-elect it. If a patient improves, they can come off hospice and re-enroll later.\n\n6/ The earlier the conversation, the more hospice can do. Calling us doesn't commit anyone to anything. We answer questions too.\n\n7/ 805.953.7273 or eternallifehospice.com/refer. We're available 24/7.`},

'1-gbp-fri':{title:'Family Education — What We Teach',plat:'Google Business',day:'Fri Aug 21',time:'9:00 AM',status:'Scheduled',
  img:'Family in living room with hospice nurse — gentle, warm',
  tags:['#HospiceCare','#FamilySupport','#EternalLifeHospice','#CaregiverSupport'],
  copy:`One of the most important things we do is teach.\n\nFamilies who understand what to expect are less afraid. They know what the medications do, what changes to watch for, and when to call us versus when to call 911.\n\nOur nurses and social workers spend time educating every family — not because it's required, but because it makes everything that follows better.\n\n"They explained everything. Nothing surprised us." — Family in Thousand Oaks\n\n805.953.7273 · eternallifehospice.com`},

'2-gbp-mon':{title:'Sound Bath Therapy — Comfort for Mind and Body',plat:'Google Business',day:'Mon Aug 24',time:'9:00 AM',status:'Scheduled',
  img:'Singing bowl close-up — warm light, hands holding bowl',
  tags:['#SoundBath','#HospiceCare','#EternalLifeHospice','#VenturaCounty','#IntegrativeTherapy'],
  copy:`Anxiety and restlessness are some of the most distressing symptoms in the final stages of illness.\n\nOur sound bath sessions — using Himalayan singing bowls and guided resonance — provide measurable relief without additional medication. Particularly effective for patients with dementia who respond to non-verbal, sensory comfort.\n\nAll integrative therapies are included at no additional expense to families.\n\n805.953.7273 · eternallifehospice.com/sound-bath`},

'2-fb-mon':{title:'Hospice Is More Than Medicine',plat:'Facebook',day:'Mon Aug 24',time:'11:00 AM',status:'Scheduled',
  img:'Carousel 5 slides: one therapy per slide. Beautiful imagery. Designer to source/produce.',
  tags:['#HospiceCare','#WholePersonCare','#IntegrativeTherapies','#CareThatHonorsLife','#EternalLifeHospice'],
  copy:`Care That Honors Life — the whole life.\n\nHospice isn't just medicine. It's the sound of a singing bowl when anxiety won't quiet. It's music at the bedside when words fail. It's the scent of lavender when nausea won't pass. It's a therapy dog's warmth when loneliness weighs heavy. It's a volunteer's presence when the room feels too big.\n\nAt Eternal Life Hospice, integrative therapies are part of The Eternal Standard. Provided at no additional expense to families.\n\nBecause every person deserves comfort that honors who they are.\n\nLearn more: eternallifehospice.com/resources/comfort-therapies\n805.953.7273 | eternallifehospice.com`},

'2-em-tue':{title:'Care Ally Email: Our Integrative Therapy Program',plat:'Email — Care Ally',day:'Tue Aug 25',time:'9:00 AM',status:'Scheduled',
  img:'Email with sound bowl image or therapy collage header.',
  tags:['Referral partners','Case managers','Palliative care teams'],
  copy:`SUBJECT: Beyond medication — integrative therapies at Eternal Life Hospice\n\nDear [First Name],\n\nWhen you refer a patient to us, they receive more than clinical care.\n\nOur integrative therapy program — included at no additional expense — provides:\n\n• Sound baths (singing bowls) — for anxiety, agitation, and restlessness. Especially effective in dementia.\n• Music at the bedside — live or recorded, tailored to patient preference. Reduces PRN medication need.\n• Aromatherapy — lavender, peppermint, chamomile. Contraindication-screened against current medications.\n• Pet therapy — certified therapy dogs, infection-control protocols, patient consent.\n• Volunteer presence — trained companionship, respite for family caregivers.\n\nAll modalities are clinically assessed, documented in the EMR, and coordinated with the medical director.\n\nThese are part of why families report higher satisfaction with hospice care.\n\nWith gratitude,\nAleksandra Dubina`},

'2-li-tue':{title:'Whole-Person Comfort: The Clinical Case for Integrative Therapies',plat:'LinkedIn',day:'Tue Aug 25',time:'8:00 AM',status:'Scheduled',
  img:'Professional infographic: 5 therapy categories with clinical rationale. Designer to produce.',
  tags:['#HospiceCare','#IntegrativeMedicine','#PalliativeCare','#WholePersonCare','#ClinicalExcellence'],
  copy:`In hospice, symptom management is the floor. Whole-person comfort is the ceiling.\n\nAt Eternal Life Hospice, integrative therapies are not extras. They are clinically assessed and delivered as part of the interdisciplinary care plan.\n\nSound-Based Comfort — singing bowls for anxiety and agitation, particularly effective in dementia patients responding to non-verbal stimuli.\n\nMusic at the Bedside — reduces perception of pain and decreases need for PRN medications. Tailored to patient preference.\n\nAromatherapy — essential oils for nausea, anxiety, and sleep disruption. Contraindicated against current meds.\n\nPet Therapy — certified therapy dogs, infection control protocols, documented in care plan.\n\nVolunteer Presence — trained companionship and respite for family caregivers.\n\nAll included in the Medicare hospice benefit. All at no additional expense to families.\n\n— Aleksandra Dubina, Certified Hospice Administrator\n\n#HospiceCare #IntegrativeMedicine #PalliativeCare`},

'2-li-fri':{title:'Aromatherapy in Hospice — What the Evidence Shows',plat:'LinkedIn',day:'Fri Aug 28',time:'8:00 AM',status:'Scheduled',

  copy:`Essential oils are not alternative medicine. In hospice, they are a clinically-assessed adjunct to symptom management.\n\nAt Eternal Life Hospice, our aromatherapy protocol:\n— Lavender for anxiety and sleep disruption\n— Peppermint for nausea and appetite stimulation\n— Chamomile for agitation and restlessness\n\nEvery patient's medication list is reviewed for contraindications before aromatherapy is offered. It is documented in the EMR and coordinated with the medical director.\n\nFor referring providers: these therapies are included in the Medicare hospice benefit and provided at no additional expense.\n\n— Aleksandra Dubina\nCertified Hospice Administrator\n\n#HospiceCare #IntegrativeMedicine #PalliativeCare`},

'5-li-tue':{title:'What Case Managers Should Know About Caregiver Burnout',plat:'LinkedIn',day:'Tue Sep 15',time:'8:00 AM',status:'Scheduled',
  img:'Data graphic: burnout stats before vs. after hospice admission',
  tags:['#HospiceCare','#CaregiverBurnout','#CaseManagement','#HealthcareProfessionals'],
  copy:`65% of family caregivers show clinically significant burnout before hospice admission.\n\nThis matters to case managers and discharge planners for one reason: burnout increases readmission risk, reduces medication adherence, and accelerates patient decline.\n\nWhen a family reaches out to hospice, they are often at a breaking point. Our social workers conduct a caregiver needs assessment on admission and begin formal support within 48 hours.\n\nWhat changes after hospice: respite care, volunteer companionship, and 24/7 nursing on-call reduce the load that has been entirely on family members.\n\nEarly referral is the most powerful intervention available for caregiver burnout.\n\nOne call: 805.953.7273\nRefer: eternallifehospice.com/refer\n\n#HospiceCare #CaregiverBurnout #CaseManagement`},

  copy:`1/ Five signs that a family is ready for hospice — even if they haven't used that word yet. 🧵\n\n2/ The primary caregiver hasn't slept through the night in weeks. Pain management at home is no longer working.\n\n3/ The patient has had two or more ER visits in the last 30 days for symptom crises that could have been managed at home.\n\n4/ The patient or family has said (or implied): "We don't want to go back to the hospital."\n\n5/ Goals of care have shifted — but no one has made the formal transition from curative to comfort treatment.\n\n6/ The family is managing everything alone and is visibly overwhelmed. The patient's quality of life is declining faster than anyone expected.\n\n7/ If any of these sound familiar: 805.953.7273. We answer 24/7. Calling us doesn't commit anyone to anything.`},

'6-em-tue':{title:'Care Ally Email: ACHC Accreditation — What It Means for Your Patients',plat:'Email — Care Ally',day:'Tue Sep 22',time:'9:00 AM',status:'Scheduled',
  img:'Email: ACHC seal prominent. ELH header. Clean layout.',
  tags:['Physicians','Hospital administrators','Discharge planners','Quality teams'],
  copy:`SUBJECT: Why ACHC accreditation matters when you refer\n\nDear [First Name],\n\nEvery hospice in California must hold two credentials: Medicare certification and CDPH licensure. We hold both.\n\nACHC accreditation is different. It is voluntary.\n\nThe Accreditation Commission for Health Care conducts an independent, on-site review of clinical standards, policies, staff competencies, patient outcomes, and organizational governance. They verify what other credentials only require us to assert.\n\nWhen you refer a patient to us, ACHC accreditation means:\n• An independent body has reviewed our clinical protocols\n• Our staff competencies have been externally validated\n• Our documentation and care planning meet standards above the minimum\n• You can explain our credentials to families with confidence\n\nAccreditation details: eternallifehospice.com/about\n\nAleksandra Dubina`},

'6-li-tue':{title:'Why We Pursued ACHC Accreditation Voluntarily',plat:'LinkedIn',day:'Tue Sep 22',time:'8:00 AM',status:'Scheduled',
  img:'ACHC seal with ELH branding. Or Aleksandra with credential.',
  tags:['#ACHC','#HospiceCare','#HealthcareQuality','#ClinicalExcellence','#EternalLifeHospice'],
  copy:`Three credentials. Two required. One chosen.\n\nMedicare certification is required to operate.\nCDPH licensure is required by California.\nACHC accreditation is voluntary.\n\nWe pursued it anyway — because families deserve more than the minimum, and because referring providers deserve the ability to say, with confidence, that the hospice they send patients to has been independently reviewed.\n\nACHC sends surveyors on-site. They review our clinical protocols, staff competencies, documentation, governance, and patient outcomes. They don't take our word for anything.\n\nFor discharge planners and physicians: our ACHC status is verifiable at achc.org.\n\n— Aleksandra Dubina\nCertified Hospice Administrator\n\n#ACHC #HospiceCare #ClinicalExcellence`},

'8-gbp-mon':{title:'Our Sound Bath Program — What It Is',plat:'Google Business',day:'Mon Oct 5',time:'9:00 AM',status:'Scheduled',

  tags:['#SoundBath','#HospiceCare','#EternalLifeHospice','#IntegrativeTherapy'],
  copy:`Anxiety, restlessness, and agitation are among the most distressing symptoms at the end of life — and among the hardest to address with medication alone.\n\nOur sound bath sessions use Himalayan singing bowls to create a field of resonance that reduces anxiety and induces calm. Particularly effective for patients with dementia, who respond to sensory experience even when verbal communication has faded.\n\nAll at no additional expense to families.\n\nLearn more: eternallifehospice.com/sound-bath\n805.953.7273`},

'8-em-tue':{title:'Care Ally Email: Our Sound Bath & Music Therapy Program',plat:'Email — Care Ally',day:'Tue Oct 6',time:'9:00 AM',status:'Scheduled',
  img:'Email: sound bowl photo header. ELH branding. Clean layout.',
  tags:['Palliative care teams','Social workers','Physicians','Case managers'],
  copy:`SUBJECT: How we use sound and music in hospice care — a clinical overview\n\nDear [First Name],\n\nThis month's brief from our clinical team covers our sound bath and music therapy program.\n\nSound Baths (Singing Bowls)\nFor: Anxiety, agitation, restlessness — particularly in dementia patients\nEvidence: Reduces cortisol markers; effective in non-verbal patients\nAdministered by: Trained volunteers under RN supervision\nDocumented: In EMR as part of the care plan\n\nMusic Therapy\nFor: Pain perception, mood, connection\nEvidence: Reduces PRN pain medication use in observational studies\nFormat: Live or recorded, tailored to patient preference and cultural background\nAdministered by: Music therapists and trained volunteers\n\nAll modalities are assessed for patient appropriateness, screened for contraindications, and documented in the clinical record.\n\nFree resource: eternallifehospice.com/sound-bath\n\nAleksandra Dubina`},

'8-li-tue':{title:'Integrative Modalities: The Clinical Rationale',plat:'LinkedIn',day:'Tue Oct 6',time:'8:00 AM',status:'Scheduled',
  img:'Clean infographic: 5 modalities, brief evidence note for each. Designer to produce.',
  tags:['#HospiceCare','#IntegrativeMedicine','#PalliativeCare','#ClinicalExcellence'],
  copy:`"Integrative therapies" is not a soft term. In hospice, these are evidence-informed interventions with measurable outcomes.\n\nAt Eternal Life Hospice, here's what our clinical team documents:\n\nSound Baths — reduces anxiety markers in dementia patients. Non-pharmacological, non-invasive.\n\nMusic Therapy — observational evidence shows reduction in PRN medication use. Cultural tailoring improves patient connection.\n\nAromatherapy — lavender reduces self-reported anxiety and sleep disruption. Screened for medication contraindications.\n\nPet Therapy — mood elevation and pain perception reduction. Infection control protocols enforced.\n\nVolunteer Presence — reduces caregiver burden, documented in care plan for continuity.\n\nAll documented in EMR. All included in the Medicare benefit. All at no additional expense.\n\n#HospiceCare #IntegrativeMedicine #PalliativeCare`},

'9-tw-fri':{title:'Thread: 5 Things Families Wish They\'d Known',plat:'Twitter / X',day:'Fri Oct 16',time:'10:00 AM',status:'Scheduled',

'10-yt-thu':{title:'YouTube: A Guide for Discharge Planners and Case Managers',plat:'YouTube',day:'Thu Oct 22',time:'10:00 AM',status:'Draft',

'10-li-fri':{title:'Why Early Referral Matters',plat:'LinkedIn',day:'Fri Oct 23',time:'8:00 AM',status:'Scheduled',
  img:'Aleksandra headshot or data graphic showing outcomes curve',
  tags:['#HospiceCare','#EarlyReferral','#PalliativeCare','#HealthcareProfessionals'],
  copy:`The most impactful thing a referring provider can do is refer early.\n\nNot because hospice hurries anything. Because hospice gives families more of what matters — time at home, pain managed, presence over panic.\n\nThe research is consistent: patients who enter hospice three months before death have better symptom control, less depression, and higher family satisfaction than those who enter in the final two weeks.\n\nAnd yet the median hospice length of stay in California is still under 20 days.\n\nThe conversation about hospice is not the same as choosing hospice. Starting it early gives families time to make the right decision for themselves.\n\n— Aleksandra Dubina\nCertified Hospice Administrator\n\n#HospiceCare #EarlyReferral #PalliativeCare`},

  copy:`As the year winds down, many families face a question they've been putting off:\n\nShould we be looking at hospice before the holidays?\n\nThe answer depends on the clinical picture — but the conversation doesn't hurt. A phone call costs nothing. And knowing your options before you need them changes everything.\n\nWe're here, 24/7, including every holiday.\n\n805.953.7273 · eternallifehospice.com`},

'11-em-tue':{title:'Care Ally Email: Year-End — Planning for Families in Q4',plat:'Email — Care Ally',day:'Tue Oct 27',time:'9:00 AM',status:'Scheduled',
  img:'Email: warm autumn-toned header. ELH plum/gold. Clean layout.',
  tags:['Hospital social workers','Discharge planners','Case managers','Palliative care'],
  copy:`SUBJECT: Year-end hospice planning — a checklist for care teams\n\nDear [First Name],\n\nAs we move into Q4, a few things worth keeping on your radar:\n\n1. Families often want to be home for the holidays. If a patient on your caseload has been declining and is likely eligible for hospice, now is a good time to start the conversation — before the holiday crunch.\n\n2. Medicare hospice benefit periods reset. Some patients who exhausted an earlier benefit period may have re-established eligibility. We can verify.\n\n3. Advance care planning — year-end is a natural moment for families to complete advance directives, POLST forms, and goals-of-care documentation. Our social workers support this.\n\n4. Same-day admissions remain available through the holiday season. We do not reduce capacity.\n\n5. The Eternal Care Brief Issue 3 arrives November 4th — with a year-end planning guide for care professionals.\n\nAlways here,\nAleksandra Dubina`},

'11-fb-mon':{title:'Hospice Before the Holidays — What Families Ask',plat:'Facebook',day:'Mon Oct 26',time:'11:00 AM',status:'Scheduled',
  img:'Warm family gathering image — multi-generational, autumn light',
  tags:['#HospiceCare','#HolidayPlanning','#FamilySupport','#CareThatHonorsLife'],
  copy:`This time of year, we hear a question from a lot of families:\n\n"Should we start hospice before the holidays, or wait until after?"\n\nOur honest answer: if your loved one is eligible now, waiting doesn't help them. It gives them fewer weeks of the support they need.\n\nHospice doesn't change what the holidays look like. It makes them more possible — at home, with pain managed, with a team on call if anything changes.\n\n"We're so glad we started before Thanksgiving. They spent Christmas at home." — Family in Thousand Oaks\n\nWe're here 24/7, including every holiday.\n\n805.953.7273 | eternallifehospice.com`},

'11-li-thu':{title:'For Case Managers: Year-End Census Planning',plat:'LinkedIn',day:'Thu Oct 29',time:'8:00 AM',status:'Scheduled',
  img:'Professional planning graphic — calendar, checklist, Q4 focus',
  tags:['#HospiceCare','#CaseManagement','#DischargePlanning','#YearEnd','#HealthcareProfessionals'],
  copy:`For case managers and discharge planners heading into Q4:\n\nA few year-end considerations that affect your hospice referrals.\n\n1. Benefit period timing: Patients who began a Medicare hospice benefit period in Q1 or Q2 may be approaching a benefit period transition. We can verify eligibility and recertification status.\n\n2. Goal-of-care alignment: Year-end is a natural time for patients and families to revisit goals. If conversations have been deferred, this is a good moment to re-engage.\n\n3. Home for the holidays: Many families express a strong preference to remain home through the holiday season. If a patient is clinically appropriate for hospice, earlier enrollment gives them more time at home before the holiday period.\n\n4. Same-day capacity: We maintain same-day admission availability through the holiday season. Capacity does not reduce.\n\nThe Eternal Care Brief Issue 3 — publishing November 4th — includes a year-end planning guide for care teams.\n\nSubscribe: eternallifehospice.com/care-brief\n\n#HospiceCare #CaseManagement #YearEndPlanning`},

'0-li-tue':{title:'The Hospice Conversation Physicians Dread',plat:'LinkedIn',day:'Tue Aug 11',time:'8:00 AM',status:'Scheduled',
  img:'Clean editorial graphic: stethoscope + speech bubble on cream bg',
  tags:['#HospiceCare','#PhysicianAdvocacy','#EndOfLifeCare','#PalliativeCare','#EternalLifeHospice'],
  copy:`There is a conversation most physicians dread.\n\nNot because they don't know what to say.\nBecause they know the family isn't ready to hear it.\n\n"Your loved one's illness is no longer responding to treatment."\n\nWhat comes next doesn't have to be silence or uncertainty.\n\nA hospice referral gives families a team, a plan, and a path — on their terms, at home, with dignity.\n\nFor physicians in Ventura and Los Angeles County: we are a one-call partner. You make the referral, we handle everything that follows.\n\n805.953.7273 · eternallifehospice.com/refer\n\n— Aleksandra Dubina\nFounder & CEO, Eternal Life Hospice\n\n#HospiceCare #EndOfLifeCare #PhysicianAdvocacy`},

'0-li-thu':{title:'Six Diagnoses That Qualify for Hospice — A Quick Reference',plat:'LinkedIn',day:'Thu Aug 13',time:'8:00 AM',status:'Scheduled',
  img:'Clean infographic: 6 diagnosis categories with icons. Plum/gold/cream.',
  tags:['#HospiceCare','#ClinicalReference','#EndOfLifeCare','#HealthcareProfessionals','#DischargePlanning'],
  copy:`For care teams: a quick-reference guide to common diagnoses that qualify for the Medicare hospice benefit.\n\n1. Oncologic — any solid or hematologic malignancy with disease progression\n2. Cardiac — end-stage heart failure, NYHA Class IV, EF typically <20%\n3. Pulmonary — end-stage COPD, FEV1 <30% predicted, recurrent hospitalizations\n4. Neurologic — end-stage dementia (FAST Stage 7), ALS with respiratory involvement, stroke with severe deficits\n5. Renal — end-stage renal disease, not pursuing dialysis\n6. Hepatic — end-stage liver disease, Child-Pugh Class C, diuretic-resistant ascites\n\nClinical rule of thumb: if you'd answer "yes" to "Would you be surprised if this patient died in the next 6 months?" — it's time to have the conversation.\n\nWe verify eligibility on every inquiry. Call us before you're certain.\n\n805.953.7273 · eternallifehospice.com/refer\n\n#HospiceCare #DischargePlanning #ClinicalReference`},

'1-li-thu':{title:'Early Referral: What the Data Actually Shows',plat:'LinkedIn',day:'Thu Aug 20',time:'8:00 AM',status:'Scheduled',
  img:'Data graphic: "Enrolled <1 week vs >1 month" comparison. Plum/gold bars.',
  tags:['#HospiceCare','#EarlyReferral','#DischargePlanning','#PalliativeCare','#HealthcareOutcomes'],
  copy:`For case managers, discharge planners, and physicians: the research on early hospice enrollment is clear.\n\nPatients enrolled in hospice earlier — weeks or months before death, not days — show:\n\n• Higher family satisfaction scores\n• Lower rates of ER visits and hospital readmissions\n• Lower rates of ICU use in the final weeks of life\n• Improved caregiver well-being and reduced complicated grief\n\nMedicare data consistently shows that patients with longer hospice stays are better served — and so are the families supporting them.\n\nEarly referral is not premature. It is the standard of excellent care.\n\nWe accept referrals the same day the conversation happens. 805.953.7273\n\n#HospiceCare #EarlyReferral #DischargePlanning #PalliativeCare`},

'1-li-sat':{title:'The Interdisciplinary Team — What Each Member Actually Does',plat:'LinkedIn',day:'Sat Aug 22',time:'9:00 AM',status:'Scheduled',
  img:'Clean role breakdown graphic: 7 roles with brief descriptor each. Plum/cream.',
  tags:['#HospiceCare','#InterdisciplinaryTeam','#EndOfLifeCare','#CareThatHonorsLife'],
  copy:`When a patient enrolls in hospice, they get a team — not a nurse.\n\nHere is what each member of our interdisciplinary team actually does:\n\n🩺 Medical Director: Certifies eligibility, supervises the care plan, orders medications\n👩‍⚕️ Registered Nurse: Primary clinician. Assessment, symptom management, family education, 24/7 on-call\n🧑‍⚕️ Home Health Aide: Personal care — bathing, grooming, comfort\n🧑‍💼 Social Worker: Family counseling, community resources, advance directive support, family meeting facilitation\n✝️ Chaplain: Spiritual support for patients and families of any tradition, or none\n🤝 Volunteers: Companionship, caregiver respite, reading aloud, presence\n💙 Bereavement Coordinator: 13 months of grief support for the family after loss\n\nThis is what the Medicare hospice benefit funds for every enrolled patient.\n\n#HospiceCare #InterdisciplinaryTeam #EndOfLifeCare`},

'1-fb-wed':{title:'Your Questions About Hospice — Answered',plat:'Facebook',day:'Wed Aug 19',time:'11:00 AM',status:'Scheduled',
  img:'Q&A format graphic: questions in plum speech bubbles, answers in cream text.',
  tags:['#HospiceCare','#HospiceMyths','#Medicare','#FamilySupport','#EternalLifeHospice'],
  copy:`The questions we hear most often — and the honest answers.\n\n❓ "Does choosing hospice mean we're giving up?"\nNo. It means you're choosing comfort and presence over procedures that aren't helping.\n\n❓ "Can our regular doctor still be involved?"\nYes. Your physician remains on the team. Our medical director coordinates with them.\n\n❓ "What if our loved one gets better?"\nPatients can leave hospice at any time and re-enroll later. Improvement is always welcome.\n\n❓ "Will hospice speed up death?"\nNo. Research shows hospice patients often live as long or longer than those who continue aggressive treatment — with significantly better quality of life.\n\n❓ "Do we have to be in a facility?"\nNo. Most of our patients receive care at home.\n\nMore questions? Call us: 805.953.7273\n\n#HospiceCare #Medicare #FamilySupport`},

'1-fb-fri':{title:'What the First 48 Hours Taught Us About Families',plat:'Facebook',day:'Fri Aug 21',time:'11:00 AM',status:'Scheduled',
  img:'Warm editorial: family and nurse at kitchen table. Natural light.',
  tags:['#HospiceCare','#FamilySupport','#CareThatHonorsLife','#EternalLifeHospice'],
  copy:`After thousands of first visits, we've learned something consistent.\n\nFamilies don't need more information in the first 48 hours.\n\nThey need to feel less alone.\n\nOur nurses are trained to assess clinical needs — and human ones. What is the family afraid of? What does "a good day" look like for this person? Who will be there at 3am?\n\nThe clinical care follows from the human conversation.\n\nIf your family is approaching this moment, call us before you're certain you're ready. That call is the beginning of the support.\n\n📞 805.953.7273 | eternallifehospice.com\n\n#HospiceCare #FamilySupport #CareThatHonorsLife`},

'2-li-thu':{title:'The Clinical Case for Integrative Therapy in Hospice',plat:'LinkedIn',day:'Thu Aug 27',time:'8:00 AM',status:'Scheduled',
  img:'Research reference graphic: study titles in small text, plum/gold accent',
  tags:['#IntegrativeTherapy','#HospiceCare','#PalliativeCare','#HealthcareProfessionals','#EvidenceBasedCare'],
  copy:`Integrative modalities in hospice care are not alternative medicine.\n\nThey are evidence-informed complements to clinical care that address symptom burden and quality of life — domains where pharmacology has limits.\n\nWhat peer-reviewed literature shows:\n\n• Music therapy: associated with reductions in pain perception, anxiety, and dyspnea in end-of-life populations\n• Animal-assisted therapy: improved mood, social engagement, and reduced agitation in dementia patients\n• Aromatherapy with lavender: modest anxiolytic effect; well-tolerated with minimal interactions\n• Massage and light touch: reduced pain scores and increased relaxation in hospice patients\n\nAt Eternal Life Hospice, integrative therapies are offered at no additional expense to families — funded by our operating model, not by families.\n\nFor care professionals: these are features worth mentioning to families during the referral conversation.\n\n#IntegrativeTherapy #HospiceCare #PalliativeCare`},

'2-li-sat':{title:'Why We Fund Integrative Therapies — The Business Case',plat:'LinkedIn',day:'Sat Aug 29',time:'9:00 AM',status:'Scheduled',
  img:'Clean graphic: cost-per-session vs value of outcomes. Minimal design.',
  tags:['#HospiceCare','#IntegrativeTherapy','#HealthcareLeadership','#CareThatHonorsLife'],
  copy:`People sometimes ask why we invest in sound baths, pet therapy, and aromatherapy when they aren't reimbursed by Medicare.\n\nThe answer is straightforward.\n\nFamilies choose hospice based on trust. Trust is built through the quality of every interaction — including the ones that aren't clinical.\n\nA sound bath session that reduces anxiety doesn't show up in a CAHPS score. But the family that experienced it calls their friends and physicians when the next referral is needed.\n\nThe integrative modalities we offer are not a luxury add-on. They are part of what makes Eternal Life Hospice a referral destination.\n\nExcellence is self-funding when it drives census.\n\n— Aleksandra Dubina\nFounder & CEO, Eternal Life Hospice\n\n#HospiceCare #IntegrativeTherapy #HealthcareLeadership`},

'2-fb-wed':{title:'Comfort That Comes in Many Forms',plat:'Facebook',day:'Wed Aug 26',time:'11:00 AM',status:'Scheduled',
  img:'Photo collage: sound bowl, therapy dog, hands with lotion, lavender. Warm tone.',
  tags:['#IntegrativeCare','#HospiceCare','#ComfortCare','#EternalLifeHospice','#CareThatHonorsLife'],
  copy:`Comfort isn't only medical.\n\nAt Eternal Life Hospice, patients have access to:\n\n🎵 Sound bath therapy — singing bowls for calm and pain relief\n🐾 Certified pet therapy — joy and connection at the bedside\n💆 Massage and therapeutic touch — reducing anxiety and tension\n🌿 Aromatherapy — gentle and effective, with lavender and other botanicals\n🎶 Music therapy — personalized to the patient's history and preferences\n\nNone of these replace clinical care.\nAll of them make it better.\n\nAnd all of them are included — at no additional expense to families.\n\n805.953.7273 | eternallifehospice.com\n\n#IntegrativeCare #HospiceCare #ComfortCare`},

'2-fb-fri':{title:'Music — The Medicine That Works When Others Can't',plat:'Facebook',day:'Fri Aug 28',time:'11:00 AM',status:'Scheduled',
  img:'Patient with headphones or live musician at bedside — warm, intimate',
  tags:['#MusicTherapy','#HospiceCare','#EternalLifeHospice','#CareThatHonorsLife','#ComfortCare'],
  copy:`A patient who hadn't spoken in three days hummed along to his favorite song.\n\nThat is what music therapy does.\n\nAt Eternal Life Hospice, we incorporate music into the care plan — the patient's own favorites, the songs that meant something, the hymns from a tradition they carried for decades.\n\nIt reduces anxiety. It surfaces memory. It connects families.\n\nAnd sometimes it reaches patients when nothing else can.\n\nAll included. At no additional expense to families.\n\n805.953.7273 | eternallifehospice.com\n\n#MusicTherapy #HospiceCare #CareThatHonorsLife`},

'3-fb-fri':{title:'Why We Publish The Eternal Care Brief',plat:'Facebook',day:'Fri Sep 4',time:'11:00 AM',status:'Scheduled',

  tags:['#EternalCareBrief','#HospiceCare','#EternalLifeHospice','#CaregiverSupport'],
  copy:`Most hospice communication is reactive.\n\nFamilies get information when something is happening. Care professionals get a referral packet and a phone number.\n\nWe wanted to do something different.\n\nThe Eternal Care Brief is our standing commitment to education — for families navigating end-of-life care, and for the physicians, nurses, and social workers who refer patients to us.\n\nEvery issue is free. Every issue is written to inform, not to sell.\n\nBecause when families are informed, they make better decisions. And better decisions lead to better care.\n\nSubscribe: eternallifehospice.com/care-brief\n\n#EternalCareBrief #HospiceCare #Education`},

'3-li-thu':{title:'What Healthcare Teams Tell Us About Our Admissions Process',plat:'LinkedIn',day:'Thu Sep 3',time:'8:00 AM',status:'Scheduled',
  img:'Clean professional graphic: quote cards from care partners. Plum/cream.',
  tags:['#HospiceCare','#DischargePlanning','#HealthcarePartnership','#HospiceReferral','#CaseManagement'],
  copy:`We regularly ask the discharge planners and social workers we partner with: "What matters most to you in a hospice partner?"\n\nThree things come up every time.\n\n1. Speed. "When I refer, I need to know someone contacted the family the same day."\n\n2. Communication. "Tell me what's happening. I shouldn't have to follow up to find out if the admission went through."\n\n3. Reliability. "When you say you can do something, do it. Every time."\n\nOur admissions process was built around exactly these three priorities.\n\n— Family contact within 2 hours\n— Admission confirmation sent to referring party\n— Care in place within 24 hours of the referral\n\nWe measure ourselves against these standards on every admission.\n\n📞 805.953.7273 to refer\n\n#HospiceCare #DischargePlanning #HealthcarePartnership`},

};

// ─── PLATFORM LABELS ────────────────────────────────────────────────────────
const PLAT_LABELS = { gbp:'Google Business', fb:'Facebook', li:'LinkedIn', tw:'Twitter / X', tt:'TikTok', yt:'YouTube' };

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentWeek = 0;
let currentFilter = 'all';

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderWeek(w) {
  const week = WEEKS[w];
  document.getElementById('wlabel').textContent = week.label;
  document.getElementById('wtheme').textContent = week.theme;
  document.getElementById('wbadge').textContent = `Week ${w+1} of ${WEEKS.length}`;
  document.getElementById('week-counter').textContent = `Week ${w+1} of 13 · Aug–Nov 2026`;

  const main = document.getElementById('cal-main');
  main.innerHTML = '';

  // Day headers
  const days = ['mon','tue','wed','thu','fri'];
  const [start] = week.label.split(' – ');
  const dayLabels = getDayLabels(w);
  const hdr = document.createElement('div');
  hdr.className = 'day-header';
  hdr.innerHTML = '<div></div>' + dayLabels.map(d=>`<div class="dh">${d}</div>`).join('');
  main.appendChild(hdr);

  // Platform rows — public social channels only
  const plats = ['gbp','fb','li','tw','tt','yt'];
  const plat_icons = {
    gbp:`<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M21.8 10.2h-.8V10H12v4h5.7A6 6 0 1 1 12 6c1.6 0 3 .6 4.1 1.6L19 4.8A10 10 0 1 0 22 12c0-.6-.1-1.2-.2-1.8z"/></svg>`,
    fb:`<svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>`,
    li:`<svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2" fill="white"/></svg>`,
    tw:`<svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
    tt:`<svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.17 8.17 0 0 0 4.78 1.52V6.76a4.84 4.84 0 0 1-1.01-.07z"/></svg>`,
    yt:`<svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.95C5.12 20 12 20 12 20s6.88 0 8.59-.47a2.78 2.78 0 0 0 1.95-1.95A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="#FF0000"/></svg>`,
    em:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C9B07E" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 4 10 9 10-9"/></svg>`
  };

  let totalSched=0, totalDraft=0, totalPub=0;
  const cnts = {gbp:0,fb:0,li:0,tw:0,tt:0,yt:0};

  plats.forEach(p => {
    const row = document.createElement('div');
    row.className = 'cal-row';
    row.dataset.platform = p;

    const iconDiv = document.createElement('div');
    iconDiv.className = 'row-icon';
    iconDiv.innerHTML = `<div class="ri ri-${p}">${plat_icons[p]}</div>`;
    row.appendChild(iconDiv);

    days.forEach(d => {
      const key = `${w}-${p}-${d}`;
      const post = POSTS[key];
      const cell = document.createElement('div');
      if (post) {
        cell.className = 'cell';
        cell.dataset.platform = p;
        const stClass = post.status==='Scheduled'?'st-sched':post.status==='Draft'?'st-draft':post.status==='Published'?'st-pub':'st-brief';
        const isBrief = post.title.startsWith('★');
        cell.innerHTML = `<div class="c-title">${post.title}</div><div class="c-preview">${post.copy.split('\n')[0]}</div><div class="c-foot"><span class="st ${stClass}">${post.status}</span><span class="c-time">${post.time}</span></div>`;
        cell.onclick = () => openPost(key);
        if(post.status==='Scheduled') totalSched++;
        else if(post.status==='Draft') totalDraft++;
        else if(post.status==='Published') totalPub++;
        cnts[p]++;
      } else {
        cell.className = 'cell empty';
        cell.dataset.platform = p;
        cell.innerHTML = '<div class="empty-plus">+</div>';
      }
      row.appendChild(cell);
    });
    main.appendChild(row);
  });

  // Update counts
  const total = totalSched+totalDraft+totalPub;
  document.getElementById('ps-sched').textContent = totalSched;
  document.getElementById('ps-draft').textContent = totalDraft;
  document.getElementById('ps-pub').textContent = totalPub;
  document.getElementById('ps-total').textContent = total;
  document.getElementById('ps-fill').style.width = (total/14*100)+'%';
  document.getElementById('sb-sched').textContent = totalSched;
  document.getElementById('sb-draft').textContent = totalDraft;
  document.getElementById('sb-pub').textContent = totalPub;

  const totalCount = Object.values(cnts).reduce((a,b)=>a+b,0);
  document.getElementById('cnt-all').textContent = totalCount;
  Object.keys(cnts).forEach(k=>{ document.getElementById('cnt-'+k).textContent = cnts[k]; });

  // Reapply filter
  applyFilter(currentFilter);
}

function getDayLabels(w) {
  // Hardcoded day labels per week
  const labels = [
    ['Mon · 10','Tue · 11','Wed · 12','Thu · 13','Fri · 14'],
    ['Mon · 17','Tue · 18','Wed · 19','Thu · 20','Fri · 21'],
    ['Mon · 24','Tue · 25','Wed · 26','Thu · 27','Fri · 28'],
    ['Mon · 31','Tue · 1','Wed · 2','Thu · 3','Fri · 4'],
    ['Mon · 7','Tue · 9','Wed · 10','Thu · 11','Fri · 12'],  // Sep — Tue is Sep 9 (Care Brief)
    ['Mon · 14','Tue · 15','Wed · 16','Thu · 17','Fri · 18'],
    ['Mon · 21','Tue · 22','Wed · 23','Thu · 24','Fri · 25'],
    ['Mon · 28','Tue · 29','Wed · 30','Thu · 1','Fri · 2'],  // Sep 28 – Oct 2
    ['Mon · 5','Tue · 6','Wed · 7','Thu · 8','Fri · 9'],
    ['Mon · 12','Tue · 13','Wed · 14','Thu · 15','Fri · 16'],
    ['Mon · 19','Tue · 20','Wed · 21','Thu · 22','Fri · 23'],
    ['Mon · 26','Tue · 27','Wed · 28','Thu · 29','Fri · 30'],
    ['Mon · 2','Tue · 4','Wed · 5','Thu · 6','Fri · 7'],    // Nov — Tue is Nov 4 (Care Brief)
  ];
  return labels[w] || ['Mon','Tue','Wed','Thu','Fri'];
}

function navWeek(dir) {
  const nw = currentWeek + dir;
  if (nw < 0 || nw >= WEEKS.length) return;
  currentWeek = nw;
  renderWeek(currentWeek);
}

function applyFilter(p) {
  currentFilter = p;
  document.querySelectorAll('.cal-row[data-platform]').forEach(row => {
    if (p === 'all' || row.dataset.platform === p) {
      row.style.display = 'grid';
    } else {
      row.style.display = 'none';
    }
  });
}

function filt(p, el) {
  document.querySelectorAll('.pfilt').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  applyFilter(p);
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
let curKey = null;
function openPost(key) {
  const p = POSTS[key]; if(!p) return; curKey = key;
  document.getElementById('mtitle').textContent = p.title;
  const stClass = p.status==='Scheduled'?'st-sched':p.status==='Draft'?'st-draft':'st-pub';
  const briefPill = p.title.startsWith('★') ? '<span class="mpill mpill-brief">★ Care Brief</span>' : '';
  document.getElementById('mpills').innerHTML = `${briefPill}<span class="mpill">${p.plat}</span><span class="mpill">${p.day} · ${p.time}</span><span class="mpill st ${stClass}" style="background:none;border:1px solid rgba(255,255,255,.2)">${p.status}</span>`;
  document.getElementById('mcopy').value = p.copy;
  document.getElementById('mtags').innerHTML = (p.tags||[]).map(t=>`<span class="ht">${t}</span>`).join('');
  document.getElementById('mimg').textContent = p.img || 'No image note specified.';
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');curKey=null;}
function doSchedule(){closeModal();toast('✓ Scheduled');}
function doPublish(){closeModal();toast('▶ Connecting to platform API… (add credentials to go live)');}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000);}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderWeek(0);
</script>
</body>
