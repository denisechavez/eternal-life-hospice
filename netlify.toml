# Netlify configuration for Eternal Life Hospice.
# The static site lives in website/elh-preview/. The build command runs four
# pre-deploy checks and blocks the deploy if any fail:
#
#   1. check-cookie-settings.sh        — every page must carry the Cookie Settings link
#   2. test-chat-teaser.js             — the chat widget teaser auto-popup must
#      remain a no-op (maybeShowTeaser immediately returns).  Blocks a deploy
#      if a future edit accidentally re-enables the greeting bubble that would
#      appear on every first visit to a hospice page.
#   3. check-city-scripts.py           — city-page generator must not emit
#      render-blocking <script> tags in <head>.  Renders a city page in-memory
#      and checks: no external scripts without defer/async, no bare CDN src=,
#      both deferred-loader patterns present, plus three mutation self-tests.
#      Exits 1 and cancels the deploy if the template is broken.
#   4. check-header-parity.py          — header parity + _redirects validation.
#      Verifies every standard page carries the canonical header, that every
#      redirect stub still contains a valid redirect to its documented target,
#      and that every local destination in _redirects resolves to a real file.
#      Exits 1 and cancels the deploy if any check fails.
#
# We set `base` to the site folder so Netlify runs entirely inside it. This
# isolates the deploy from the repo-root package.json (which belongs to the
# internal Outreach Tracker, not the website). Without this, Netlify would try
# to `npm install` those root dependencies during Initializing and the deploy
# would fail before it ever publishes the site.
[build]
  base = "website/elh-preview"
  publish = "."
  command = "git fetch --unshallow 2>/dev/null || true && bash ../check-cookie-settings.sh && node assets/test-chat-teaser.js && python3 ../check-city-scripts.py && python3 ../check-header-parity.py && node assets/build-search-index.js && node assets/update-sitemap-dates.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty URLs (serving /page from page.html) are enabled by default.
# Custom 404 is served automatically from /404.html.
# _redirects and _headers inside the publish directory are honored automatically.
