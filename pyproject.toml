[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
]

# The live server uses Clerk JWT verification and the existing PostgreSQL store.
# Internal publication tools must not block installing the live site.
# Install only the extra you need:
# uv sync --extra newsletter / --extra print / --extra qr
[project.optional-dependencies]
newsletter = ["Pillow>=10.0.0"]
print = ["Pillow>=10.0.0"]
qr = [
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "qrcode>=7.4.2",
    # Verification uses QRCodeDetector, not the GUI (avoid libGL/X11).
    "opencv-python-headless>=4.8.0",
]
